[build-system]
# 77 is the first setuptools that reads PEP 639's `license = "MIT"` string.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spacevalue"
dynamic = ["version"]
description = "What a kilogram of asteroid material is worth, and where it is sold: mineral and element prices for Earth's surface and seven destinations in space, from recorded market quotes, published as reproducible price releases."
readme = "README.md"
# 3.12, because the tables depend on it: Python 3.12 made sum() over floats
# compensated, and two alloy yields (taenite and tetrataenite iron) are sums,
# so 3.11 and earlier write them one bit differently.  The fixtures are the
# 3.12+ answer, which is what economicspace measured on.
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Logan M Edwards" }]
keywords = [
    "asteroid-mining", "space-resources", "commodity-prices", "isru",
    "mineral-economics", "cislunar", "reference-data", "reproducibility",
    "moon", "mars", "metal-prices",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Office/Business :: Financial",
]

# spacecost supplies the delivery chains, the launch price and the quote
# snapshot code.  It is not on PyPI, so it is pinned to a TAGGED git ref.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "spacecost @ git+https://github.com/loggger101/spacecost@v0.14.0",
]

[project.optional-dependencies]
# Live quotes only: yfinance for the COMEX closes, requests for metals.dev.
# A build from a recorded snapshot needs neither.
live = ["yfinance>=0.2", "requests>=2.0"]
# samebytes is the house-rule checks tests/test_rules.py calls (docs and
# source); test-only, so the package itself still depends on nothing new.
test = ["pytest>=7.0", "samebytes @ git+https://github.com/loggger101/samebytes@v0.3.0"]

[project.urls]
Repository = "https://github.com/loggger101/spacevalue"
Changelog = "https://github.com/loggger101/spacevalue/blob/main/CHANGELOG.md"
Releases = "https://github.com/loggger101/spacevalue/releases"
Issues = "https://github.com/loggger101/spacevalue/issues"
# Not upstream: economicspace is where this came from, and it now installs
# a price release from here as its Stage 2.
economicspace = "https://github.com/loggger101/economicspace"

[project.scripts]
spacevalue = "spacevalue.cli:main"

[tool.setuptools]
packages = ["spacevalue"]

# The recorded metal quotes ship in the wheel: every release is built from one.
[tool.setuptools.package-data]
spacevalue = ["quotes/*.csv", "quotes/SHA256SUMS"]

[tool.setuptools.dynamic]
version = { attr = "spacevalue.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
