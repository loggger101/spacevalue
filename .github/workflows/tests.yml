name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Windows is where the fixtures were written.  Linux and macOS are where a
    # different C library's exp() could round the last bit of an in-space
    # price differently; on the first run they matched byte for byte, and
    # test_reproduces.py names the columns if that ever changes.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.12 is the floor (pyproject says why: sum() over floats changed
        # there, and two alloy yields are sums).
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q
      - name: The snapshots match SHA256SUMS
        run: python -m spacevalue quotes check

  # rust/: the knapsack's Rust copy, which economicspace's es_core links.  A
  # knapsack change made only in cargo.py fails here, not on whichever machine
  # happens to have the binding built.  The planted build (one ulp in every
  # take) must fail all six Rust tests, or the tests could not see a defect;
  # SPACEVALUE_REQUIRE_RUST=1 turns their skip-when-missing into a failure.
  # The good binding is installed the way a consumer installs it, `pip
  # install` of rust/cargo_py, which builds cargo_core by its relative path.
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13", "3.14"]
    env:
      SPACEVALUE_REQUIRE_RUST: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        shell: bash
        run: python -m pip install -e ".[test]" maturin==1.9.6
      # No `cargo test`: cargo_core has no Rust tests (it is tested only
      # against cargo.py, through the binding), and a step that passes on zero
      # tests would read as coverage it is not.
      - name: The planted build fails every Rust test
        shell: bash
        run: |
          python -m maturin build --release --features planted_knapsack_defect -m rust/cargo_py/Cargo.toml -o dist-plant
          python -m pip install --force-reinstall --no-deps dist-plant/spacevalue_cargo_rs-*.whl
          python -c "import spacevalue_cargo_rs as r; assert r.planted_defect()"
          set +e
          python -m pytest -q -p no:cacheprovider tests/test_cargo_rust.py > plant.log 2>&1
          rc=$?
          set -e
          tail -3 plant.log
          [ $rc -ne 0 ] || { echo "the planted build PASSED the Rust tests"; exit 1; }
          grep -Eq "^6 failed" plant.log || { echo "expected all 6 Rust tests to fail"; exit 1; }
      - name: The good build, installed as a consumer installs it
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps ./rust/cargo_py
          python -c "import spacevalue_cargo_rs as r; assert not r.planted_defect()"
      - name: The Rust tests, then the whole suite with the binding installed
        shell: bash
        run: |
          python -m pytest -q -p no:cacheprovider tests/test_cargo_rust.py
          python -m pytest -q

  # The editable install above reads the tree, so it cannot see a snapshot or
  # a module missing from the wheel.  This installs the built wheel and uses
  # it from a directory where the source is not importable.
  wheel:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build and install the wheel
        shell: bash
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist_check
          python -m pip install dist_check/*.whl pytest
      - name: Build a release from the installed copy, and hold it to the fixtures
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import spacevalue, sys; assert 'site-packages' in spacevalue.__file__, spacevalue.__file__"
          spacevalue release --quotes metals-2026-10-07 -o rel
          for f in rel/*.csv; do
            cmp "$f" "$GITHUB_WORKSPACE/tests/data/prices-2026-10-07/$(basename "$f")"
          done
          echo "the wheel rebuilds all eight seed tables byte for byte"
      - name: The consumer contract, asked of the wheel
        shell: bash
        working-directory: ${{ runner.temp }}
        run: python -m pytest -q -p no:cacheprovider --import-mode=importlib "$GITHUB_WORKSPACE/tests/test_consumer_contract.py"

  # .githooks/ holds samebytes' stat-cache hook, because the working tree
  # lives in a synced folder.  Drift, CRLF or a lost executable bit each make
  # a copy silently useless after a checkout; this fails on any of them.  The
  # tag is the one pyproject's test extra pins (tests/test_rules.py holds the
  # two to one ref); the hooks are unchanged since samebytes v0.1.0.
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Hooks match samebytes
        run: |
          python -m pip install "samebytes @ git+https://github.com/loggger101/samebytes@v0.5.0"
          python -m samebytes hooks check .
