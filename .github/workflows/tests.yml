name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Windows is where the fixtures were written.  Linux and macOS are where a
    # different C library's exp() could round the last bit of an in-space
    # price differently; on the first run they matched byte for byte, and
    # test_reproduces.py names the columns if that ever changes.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.12 is the floor (pyproject says why: sum() over floats changed
        # there, and two alloy yields are sums).
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q
      - name: The snapshots match SHA256SUMS
        run: python -m spacevalue quotes check

  # The editable install above reads the tree, so it cannot see a snapshot or
  # a module missing from the wheel.  This installs the built wheel and uses
  # it from a directory where the source is not importable.
  wheel:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build and install the wheel
        shell: bash
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist_check
          python -m pip install dist_check/*.whl pytest
      - name: Build a release from the installed copy, and hold it to the fixtures
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import spacevalue, sys; assert 'site-packages' in spacevalue.__file__, spacevalue.__file__"
          spacevalue release --quotes metals-2026-10-07 -o rel
          for f in rel/*.csv; do
            cmp "$f" "$GITHUB_WORKSPACE/tests/data/prices-2026-10-07/$(basename "$f")"
          done
          echo "the wheel rebuilds all eight seed tables byte for byte"
      - name: The consumer contract, asked of the wheel
        shell: bash
        working-directory: ${{ runner.temp }}
        run: python -m pytest -q -p no:cacheprovider --import-mode=importlib "$GITHUB_WORKSPACE/tests/test_consumer_contract.py"

  # .githooks/ holds samebytes' stat-cache hook, because the working tree
  # lives in a synced folder.  Drift, CRLF or a lost executable bit each make
  # a copy silently useless after a checkout; this fails on any of them.  The
  # tag is the one pyproject's test extra pins (tests/test_rules.py holds the
  # two to one ref); the hooks are unchanged since samebytes v0.1.0.
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Hooks match samebytes
        run: |
          python -m pip install "samebytes @ git+https://github.com/loggger101/samebytes@v0.5.0"
          python -m samebytes hooks check .
